window.storage = {
  get: async (key, shared) => {
    if (shared && FIREBASE_READY) {
      const doc = await db.collection("kv").doc(key).get();
      if (!doc.exists) throw new Error("not found");
      return { key, value: doc.data().value, shared: true };
    }
    const p = (shared ? "shared:" : "p:") + key;
    const raw = localStorage.getItem(p);
    if (raw === null) throw new Error("not found");
    return { key, value: raw, shared: !!shared };
  },
  set: async (key, value, shared) => {
    if (shared && FIREBASE_READY) {
      await db.collection("kv").doc(key).set({ value, updatedAt: Date.now() });
      return { key, value, shared: true };
    }
    const p = (shared ? "shared:" : "p:") + key;
    localStorage.setItem(p, value);
    return { key, value, shared: !!shared };
  },
  delete: async (key, shared) => {
    if (shared && FIREBASE_READY) {
      await db.collection("kv").doc(key).delete();
      return { key, deleted: true, shared: true };
    }
    const p = (shared ? "shared:" : "p:") + key;
    localStorage.removeItem(p);
    return { key, deleted: true, shared: !!shared };
  },
  list: async (prefix, shared) => {
    if (shared && FIREBASE_READY) {
      const end = (prefix || "") + "\uf8ff";
      const snap = await db
        .collection("kv")
        .where(firebase.firestore.FieldPath.documentId(), ">=", prefix || "")
        .where(firebase.firestore.FieldPath.documentId(), "<", end)
        .get();
      return { keys: snap.docs.map((d) => d.id), prefix, shared: true };
    }
    const base = shared ? "shared:" : "p:";
    const full = base + (prefix || "");
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(full)) keys.push(k.slice(base.length));
    }
    return { keys, prefix, shared: !!shared };
  },
};

function resizeImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read failed"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("image load failed"));
      img.onload = () => {
        let { width, height } = img;
        if (Math.max(width, height) > maxDim) {
          if (width >= height) { height = Math.round((height * maxDim) / width); width = maxDim; }
          else { width = Math.round((width * maxDim) / height); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function escapeHtml(s = "") {
  return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[c]));
}

function normalizeEntry(e) {
  if (e.photos) return e;
  if (e.photo) return { ...e, photos: [{ photo: e.photo, thumb: e.thumb }] };
  return { ...e, photos: [] };
}

  const MASTER_ADMINS = [{ name: "Shohjahon", password: "shoh_2007" }];

      }
    } catch { notify("Rasmni yuklashda xatolik"); }
    setProcessingImg(false);
    e.target.value = "";
  };
  const removePhoto = (idx) => setForm((f) => ({ ...f, photos: f.photos.filter((_, i) => i !== idx) }));

  const saveToGallery = async (dataUrl, filename) => {
    try {
      const res = await fetch(dataUrl);
      const blob = await res.blob();
      const file = new File([blob], filename, { type: blob.type });
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
      notify("Rasm yuklab olindi");
    } catch (e) {
      notify("Saqlashda xatolik yuz berdi");
    }
  };

  const saveEntry = async () => {

    setSaving(true);

    const entry = {
      id: editingId || uid(), title: form.title.trim(), category: form.category, date: form.date,
      description: form.description.trim(), photos: form.photos,
      by: existing?.by || account.name, createdAt: existing?.createdAt || Date.now(), updatedAt: Date.now(),
    };
    try {
      await window.storage.set(`entry:${entry.id}`, JSON.stringify(entry), true);

  const deleteEntry = async (id) => {

  const exportPDF = (memberFilter) => {

        <p>${escapeHtml(e.description || "")}</p>
      </article>`).join("");

      <style>body{font-family:Arial,sans-serif;padding:28px;color:#17233b}h1{margin-bottom:4px}.item{border:1px solid #ddd;border-radius:12px;padding:12px;margin:12px 0;break-inside:avoid}.item img{width:180px;height:180px;object-fit:cover;border-radius:8px;float:right;margin-left:12px}.item p{line-height:1.5}</style>

  const restoreFileRef = useRef(null);

    const file = e.target.files?.[0];

      const payload = JSON.parse(text);
      const items = Array.isArray(payload) ? payload : payload.entries;
      if (!Array.isArray(items)) throw new Error("format");
      if (!confirm(`${items.length} ta yozuvni tiklashni xohlaysizmi? (mavjudlarga qo'shiladi)`)) return;
      for (const raw of items) {
        const entry = normalizeEntry(raw);
        if (!entry.id) entry.id = uid();
        try { await window.storage.set(`entry:${entry.id}`, JSON.stringify(entry), true); } catch (err) {}
      }
      const list = await window.storage.list("entry:", true);
      const results = [];
      for (const k of (list?.keys || []).slice(0, 300)) {
        try { const r = await window.storage.get(k, true); if (r?.value) results.push(normalizeEntry(JSON.parse(r.value))); } catch (err) {}
      }
      results.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      setEntries(results);
      notify("Ma'lumotlar tiklandi");
    } catch (err) { notify("Fayl formati noto'g'ri"); }
    e.target.value = "";
  };

  const wipeAll = async () => {
    if (!confirm("DIQQAT: barcha yozuvlar butunlay o'chiriladi. Davom etasizmi?")) return;
    if (!confirm("Bu amalni orqaga qaytarib bo'lmaydi. Haqiqatan ham o'chirilsinmi?")) return;
    for (const e of entries) { try { await window.storage.delete(`entry:${e.id}`, true); } catch (err) {} }
    setEntries([]);
    notify("Barcha ma'lumotlar o'chirildi");
  };

  const changeAdminPassword = async () => {
    if (changePw.length < 4) return notify("Kamida 4 belgi kiriting");
    try {
      const r = await window.storage.get(`member:${account.name}`, true);
      const acc = JSON.parse(r.value);
      acc.password = changePw;
      await window.storage.set(`member:${account.name}`, JSON.stringify(acc), true);
      notify("Parol yangilandi");
    } catch (e) { notify("Xatolik yuz berdi"); }
    setChangePw("");
  };

  // ---- chat ----
  const openChatList = async () => {
    setTab("chat"); setLoadingGroups(true);
    try {
      const list = await window.storage.list("group:", true);
      const results = [];
      for (const k of (list?.keys || []).slice(0, 200)) {
        try { const r = await window.storage.get(k, true); if (r?.value) results.push(JSON.parse(r.value)); } catch (e) {}
      }
      const mine = isAdmin ? results : results.filter((g) => (g.members || []).includes(account?.name));
      mine.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      setGroups(mine);
    } catch (e) {}
    setLoadingGroups(false);

  const createGroup = async () => {
    const name = newGroupName.trim();
    if (!name) return notify("Guruh nomini kiriting");

      setNewGroupName(""); setNewGroupMembers([]);
      setScreen(null);
      notify("Guruh yaratildi");
    } catch (e) { notify("Xatolik yuz berdi"); }
  };

  // Kiruvchi xabarlar ro'yxatini holatga yozadi va o'qilmagan xabarlarni "o'qildi" deb belgilaydi
  const applyIncomingMessages = (list, groupId, myName) => {
    const sorted = [...list].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    setMessages(sorted);
    sorted.forEach((m) => {
      if (m.by !== myName && !(m.readBy || []).includes(myName)) {
        const updated = { ...m, readBy: [...(m.readBy || []), myName] };
        window.storage.set(`msg:${groupId}:${m.id}`, JSON.stringify(updated), true).catch(() => {});
      }
    });
  };

  const loadMessages = async (groupId) => {
    try {
      const list = await window.storage.list(`msg:${groupId}:`, true);
      const results = [];
      for (const k of (list?.keys || []).slice(0, 300)) {
        try { const r = await window.storage.get(k, true); if (r?.value) results.push(JSON.parse(r.value)); } catch (e) {}
      }
      applyIncomingMessages(results, groupId, account?.name);
    } catch (e) {}
  };

  const openChat = async (group) => {
    setActiveGroup(group); setScreen("chat"); setMessages([]);
    activeGroupIdRef.current = group.id;
    if (isAdmin) loadAllUsers();
    const myName = account?.name;
    if (typeof FIREBASE_READY !== "undefined" && FIREBASE_READY && db) {
      // Firestore mavjud bo'lsa — haqiqiy real vaqt rejimi (onSnapshot)
      const start = `msg:${group.id}:`;
      const end = start + "\uf8ff";
      try {
        const q = db.collection("kv")
          .where(firebase.firestore.FieldPath.documentId(), ">=", start)
          .where(firebase.firestore.FieldPath.documentId(), "<", end);
        unsubRef.current = q.onSnapshot(
          (snap) => {
            const results = [];
            snap.forEach((doc) => {
              try { results.push(JSON.parse(doc.data().value)); } catch (e) {}
            });
            applyIncomingMessages(results, group.id, myName);
          },
          () => {
            if (pollRef.current) clearInterval(pollRef.current);
            pollRef.current = setInterval(() => loadMessages(group.id), 2500);
          }
        );
        return;
      } catch (e) {}
    }
    // Zaxira rejim: tez-tez so'rov (polling)
    await loadMessages(group.id);
    if (pollRef.current) clearInterval(pollRef.current);
    pollRef.current = setInterval(() => loadMessages(group.id), 2500);
  };

  const closeChat = () => {
    if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; }
    if (unsubRef.current) { unsubRef.current(); unsubRef.current = null; }
    activeGroupIdRef.current = null;
    setScreen(null); setActiveGroup(null); setMessages([]);
  };

  const sendMessage = async (stickerEmoji) => {
    const text = stickerEmoji ? "" : msgInput.trim();
    if (!stickerEmoji && !text) return;
    if (!activeGroup) return;
    const id = uid();
    const msg = stickerEmoji
      ? { id, groupId: activeGroup.id, type: "sticker", sticker: stickerEmoji, by: account.name, createdAt: Date.now(), readBy: [] }
      : { id, groupId: activeGroup.id, type: "text", text, by: account.name, createdAt: Date.now(), readBy: [] };
    if (!stickerEmoji) setMsgInput("");
    setMessages((p) => [...p, msg]);
    try { await window.storage.set(`msg:${activeGroup.id}:${id}`, JSON.stringify(msg), true); } catch (e) {}
  };

  const addGroupMember = async (name) => {

    const updated = { ...activeGroup, members: [...activeGroup.members, name] };
    try {
      await window.storage.set(`group:${updated.id}`, JSON.stringify(updated), true);
      setActiveGroup(updated);
      setGroups((p) => p.map((g) => (g.id === updated.id ? updated : g)));
      notify(name + " guruhga qo'shildi");
    } catch (e) { notify("Xatolik yuz berdi"); }
  };

  // ---- push-style bildirishnomalar (yangi chat xabari kelganda) ----
  const showChatNotification = (group, msg) => {
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    // Foydalanuvchi hozir aynan shu guruh chatini ochiq holda ko'rib turgan bo'lsa, bildirishnoma bermaymiz
    if (activeGroupIdRef.current === group.id && !document.hidden) return;
    const body = msg.type === "sticker" ? `${msg.by}: ${msg.sticker}` : `${msg.by}: ${msg.text}`;
    const send = (reg) => {
      const opts = { body, icon: "./icon-192.png", badge: "./icon-192.png", tag: "chat-" + group.id, renotify: true, data: { groupId: group.id } };
      if (reg && reg.showNotification) reg.showNotification(group.name, opts);
      else new Notification(group.name, opts);
    };
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.ready.then(send).catch(() => send(null));
    } else {
      send(null);
    }
  };

  const attachGroupListener = (group, myName) => {
    if (notifUnsubsRef.current[group.id]) return;
    if (!(typeof FIREBASE_READY !== "undefined" && FIREBASE_READY && db)) return;
    const start = `msg:${group.id}:`;
    const end = start + "\uf8ff";
    let first = true;
    try {
      const q = db.collection("kv")
        .where(firebase.firestore.FieldPath.documentId(), ">=", start)
        .where(firebase.firestore.FieldPath.documentId(), "<", end);
      const unsub = q.onSnapshot((snap) => {
        if (first) { first = false; return; }
        snap.docChanges().forEach((change) => {
          if (change.type !== "added") return;
          try {
            const msg = JSON.parse(change.doc.data().value);
            if (msg.by !== myName) showChatNotification(group, msg);
          } catch (e) {}
        });
      });
      notifUnsubsRef.current[group.id] = unsub;
    } catch (e) {}
  };

  const refreshNotificationListeners = async (myName, isAdminFlag) => {
    try {
      const list = await window.storage.list("group:", true);
      const results = [];
      for (const k of (list?.keys || []).slice(0, 200)) {
        try { const r = await window.storage.get(k, true); if (r?.value) results.push(JSON.parse(r.value)); } catch (e) {}
      }
      const mine = isAdminFlag ? results : results.filter((g) => (g.members || []).includes(myName));
      mine.forEach((g) => attachGroupListener(g, myName));
    } catch (e) {}
  };

  const teardownNotificationListeners = () => {
    Object.values(notifUnsubsRef.current).forEach((unsub) => { try { unsub(); } catch (e) {} });
    notifUnsubsRef.current = {};
  };

  useEffect(() => {
    if (!account) { teardownNotificationListeners(); return; }
    if (typeof Notification !== "undefined" && Notification.permission === "default") {
      Notification.requestPermission().catch(() => {});

    refreshNotificationListeners(account.name, isAdmin);
    const iv = setInterval(() => refreshNotificationListeners(account.name, isAdmin), 20000);
    return () => clearInterval(iv);
  }, [account?.name, isAdmin]);

        </div>

        </div>

    );

          onSeeAll={() => setTab("list")} />

      {screen === null && tab === "list" && (

      {screen === null && tab === "chat" && (

          onOpen={openChat} onCreate={() => setScreen("createGroup")} />

          onBack={closeChat} onSend={sendMessage} me={account?.name}
          isAdmin={isAdmin} allUsers={allUsers} onAddMember={addGroupMember} />
      )}

      {screen === "pdf" && (
        <PdfScreen isAdmin={isAdmin} allUsers={allUsers} onLoadUsers={loadAllUsers} account={account}
          onBack={() => setScreen(null)} onGenerate={exportPDF} />
      )}

      {screen === "settings" && (
        <SettingsScreen isAdmin={isAdmin} changePw={changePw} setChangePw={setChangePw}
          onChangePw={changeAdminPassword} onBack={() => setScreen(null)}
          onBackup={backupData} onRestore={() => restoreFileRef.current?.click()}
          onLogout={doLogout} />
      )}

      {screen === null && (
        <BottomNav tab={tab} setTab={(t) => t === "chat" ? openChatList() : setTab(t)}
          onAdd={() => setScreen("form")} />
      )}

      {toast && <div style={S.toast}>{toast}</div>}
    </div>
  );
}

function Donut({ counts }) {
  const total = Object.values(counts).reduce((a, b) => a + b, 0) || 1;
  let acc = 0;
  const r = 50, cx = 60, cy = 60, sw = 20;
  const circ = 2 * Math.PI * r;
  return (
    <svg width="120" height="120" viewBox="0 0 120 120">
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#F0F1F5" strokeWidth={sw} />
      {CATEGORIES.map((c) => {
        const v = counts[c.id] || 0;
        if (!v) return null;
        const frac = v / total;
        const dash = frac * circ;
        const offset = circ - acc * circ;
        acc += frac;
        return <circle key={c.id} cx={cx} cy={cy} r={r} fill="none" stroke={c.color} strokeWidth={sw}
          strokeDasharray={`${dash} ${circ - dash}`} strokeDashoffset={offset} transform={`rotate(-90 ${cx} ${cy})`} />;
      })}
    </svg>
  );
}

function LineChart({ points }) {
  if (!points.length) return <div style={{ fontSize: 12, color: "#A6ADBB", padding: "20px 0" }}>Ma'lumot yo'q</div>;
  const max = Math.max(...points.map((p) => p.value), 1);
  const w = 300, h = 100, pad = 10;
  const step = (w - pad * 2) / Math.max(points.length - 1, 1);
  const coords = points.map((p, i) => [pad + i * step, h - pad - (p.value / max) * (h - pad * 2)]);
  const path = coords.map((c, i) => (i === 0 ? "M" : "L") + c[0] + "," + c[1]).join(" ");
  return (
    <svg width="100%" height="110" viewBox={`0 0 ${w} ${h + 20}`} preserveAspectRatio="none">
      <path d={path} fill="none" stroke="#4338CA" strokeWidth="2.5" />
      {coords.map((c, i) => <circle key={i} cx={c[0]} cy={c[1]} r="3.5" fill="#4338CA" />)}
      {points.map((p, i) => <text key={i} x={coords[i][0]} y={h + 15} fontSize="9" fill="#9096A8" textAnchor="middle">{p.label}</text>)}
    </svg>
  );
}
